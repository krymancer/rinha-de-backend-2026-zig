services:
  api1:
    image: ghcr.io/krymancer/rinha-de-backend-2026-zig:98c678aee9c0d9cf186259db2bc58b34cc84c547
    command: ["/api", "/sockets/api1.sock", "/index.bin", "30", "80"]
    network_mode: none
    volumes:
      - sockets:/sockets
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "160MB"

  api2:
    image: ghcr.io/krymancer/rinha-de-backend-2026-zig:98c678aee9c0d9cf186259db2bc58b34cc84c547
    command: ["/api", "/sockets/api2.sock", "/index.bin", "30", "80"]
    network_mode: none
    volumes:
      - sockets:/sockets
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "160MB"

  lb:
    image: ghcr.io/krymancer/rinha-de-backend-2026-zig:98c678aee9c0d9cf186259db2bc58b34cc84c547
    command: ["/lb", "9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "30MB"

volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs
