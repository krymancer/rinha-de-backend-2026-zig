services:
  api1:
    image: ghcr.io/krymancer/rinha-de-backend-2026-zig:3f05ad3b034f610267e6535bdde774db5bbc9637
    command: ["/api", "/sockets/api1.sock", "/index.bin"]
    network_mode: none
    cpuset: "0"
    volumes:
      - sockets:/sockets
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "160MB"

  api2:
    image: ghcr.io/krymancer/rinha-de-backend-2026-zig:3f05ad3b034f610267e6535bdde774db5bbc9637
    command: ["/api", "/sockets/api2.sock", "/index.bin"]
    network_mode: none
    cpuset: "1"
    volumes:
      - sockets:/sockets
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "160MB"

  lb:
    image: ghcr.io/krymancer/rinha-de-backend-2026-zig:3f05ad3b034f610267e6535bdde774db5bbc9637
    command: ["/lb", "9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    cpuset: "2,3"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "30MB"

volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs
